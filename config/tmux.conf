# vscode-tmux server. Loaded only via: tmux -L vscode-tmux -f ~/.config/vscode-tmux/tmux.conf
# ~/.tmux.conf is not loaded for this server.

# --- server lifetime -------------------------------------------------------
set -s exit-empty off              # survive zero sessions
set -g destroy-unattached off      # survive the Ghostty window closing
set -g detach-on-destroy off       # killing the shown session moves the client
set -s escape-time 10
set -s extended-keys on
set -s set-clipboard on
set -s focus-events on
set -g history-limit 50000
set -g mouse on
set -g word-separators ' '         # #{mouse_word} keeps src/foo.ts:42:8 whole

# --- terminal --------------------------------------------------------------
set -g default-terminal 'tmux-256color'
# hyperlinks/osc7 need tmux >= 3.4; older versions skip unknown features.
set -as terminal-features 'xterm-ghostty:RGB,extkeys,clipboard,focus,sync,usstyle,cstyle,ccolour,title,mouse,hyperlinks,osc7'

# --- tabs (tmux windows) ---------------------------------------------------
set -wg automatic-rename off
set -wg allow-rename off
set -g renumber-windows on
set -g base-index 1
set -wg pane-base-index 1
set -g set-titles on
set -g set-titles-string '#S — #{E:@tab-label}'

# Show Claude Code's pane title while it runs; #W stays put (the daemon keys tabs by it).
# Only while the command is claude and the title is not the host default; alt+r pins #W.
set -g @tab-label '#{?#{&&:#{==:#{pane_current_command},claude},#{&&:#{!=:#{pane_title},#{host}},#{!=:#{@tab-pinned},1}}},#{pane_title},#W}'

# --- tab bar (status line) -------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left ''
set -g status-right ''
set -g status-style 'bg=#1e1e2e,fg=#a6adc8'
set -g window-status-separator ''
set -g window-status-format '#[fg=#a6adc8,bg=#1e1e2e]  #I #{=/40/…:#{E:@tab-label}}  '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold]  #I #{=/40/…:#{E:@tab-label}}  '
set -g window-status-activity-style 'fg=#f9e2af'
set -g window-status-bell-style 'fg=#f38ba8,bold'
set -g message-style 'bg=#313244,fg=#cdd6f4'

# --- keys (no prefix) -------------------------------------------------------
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n C-PageUp previous-window
bind -n C-PageDown next-window
bind -n C-WheelUpPane previous-window     # ctrl+wheel switches tabs anywhere
bind -n C-WheelDownPane next-window
bind -n M-t run-shell -b 'vscode-tmux new'
bind -n C-t run-shell -b 'vscode-tmux new'
# Full height / short strip. Rebuilds the Ghostty window, so this client dies with it.
bind -n F11 run-shell -b 'vscode-tmux height'

# Click a path to open it in this workspace's VS Code window. Ghostty only links URLs,
# so tmux resolves the click: OSC 8 link if any, else the word under the pointer.
# alt+click too, since Ghostty may claim ctrl+click on a URL.
bind -n C-MouseDown1Pane run-shell -b 'vscode-tmux click --session=#{q:session_name} --cwd=#{q:pane_current_path} --word=#{q:mouse_word} --link=#{q:mouse_hyperlink}'
bind -n M-MouseDown1Pane run-shell -b 'vscode-tmux click --session=#{q:session_name} --cwd=#{q:pane_current_path} --word=#{q:mouse_word} --link=#{q:mouse_hyperlink}'

bind -n M-r command-prompt -I '#W' 'rename-window -- "%%" ; set -w @tab-pinned 1'
bind -n M-w confirm-before -p 'close tab #{E:@tab-label}? (y/n)' kill-window
