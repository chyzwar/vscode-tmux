# vscode-tmux server configuration.
# Loaded only by the dedicated server:  tmux -L vscode-tmux -f ~/.config/vscode-tmux/tmux.conf
# The user's own ~/.tmux.conf is NOT loaded for this server.

# --- server lifetime -------------------------------------------------------
set -s exit-empty off              # keep the server alive with zero sessions
set -g destroy-unattached off      # sessions survive the Ghostty window closing
set -g detach-on-destroy off       # killing the shown session moves the client instead of detaching it
set -s escape-time 10
set -s extended-keys on
set -s set-clipboard on
set -s focus-events on
set -g history-limit 50000
set -g mouse on                    # click tabs, wheel scroll, click file paths
set -g word-separators ' '         # so #{mouse_word} keeps src/foo.ts:42:8 in one piece

# --- terminal --------------------------------------------------------------
set -g default-terminal 'tmux-256color'
# hyperlinks (OSC 8) and osc7 exist since tmux 3.4; 3.2a logs and skips unknown feature names.
set -as terminal-features 'xterm-ghostty:RGB,extkeys,clipboard,focus,sync,usstyle,cstyle,ccolour,title,mouse,hyperlinks,osc7'

# --- tabs (tmux windows) ---------------------------------------------------
set -wg automatic-rename off
set -wg allow-rename off
set -g renumber-windows on
set -g base-index 1
set -wg pane-base-index 1
set -g set-titles on
set -g set-titles-string '#S — #W'

# --- tab bar (status line) -------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left ''
set -g status-right ''
set -g status-style 'bg=#1e1e2e,fg=#a6adc8'
set -g window-status-separator ''
set -g window-status-format '#[fg=#a6adc8,bg=#1e1e2e]  #I #W  '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold]  #I #W  '
set -g window-status-activity-style 'fg=#f9e2af'
set -g window-status-bell-style 'fg=#f38ba8,bold'
set -g message-style 'bg=#313244,fg=#cdd6f4'

# --- keys (no prefix) -------------------------------------------------------
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n C-PageUp previous-window
bind -n C-PageDown next-window
bind -n C-WheelUpPane previous-window     # ctrl+wheel anywhere switches tabs (plain wheel over the tab bar does too)
bind -n C-WheelDownPane next-window
bind -n M-t run-shell -b 'vscode-tmux new'
bind -n C-t run-shell -b 'vscode-tmux new'
# F11 flips the dropdown between full height and a short strip. Ghostty's own
# toggle_fullscreen is a no-op on the layer-shell dropdown, so the daemon rewrites
# quick-terminal-size, reloads, and rebuilds the window (this client dies with it).
bind -n F11 run-shell -b 'vscode-tmux height'
# Click a file path to open it in this workspace's VS Code window and raise it.
# tmux owns the pane content, so this is where a click can be resolved: Ghostty
# 1.3 cannot be taught new link patterns (its `link` option is not settable) and
# only matches URLs. #{mouse_hyperlink} carries OSC 8 links (ripgrep, ls, delta),
# #{mouse_word} the plain `src/foo.ts:42:8` that compilers print. Ghostty may
# claim ctrl+click for a URL under the pointer, so alt+click is bound too.
bind -n C-MouseDown1Pane run-shell -b 'vscode-tmux click --session=#{q:session_name} --cwd=#{q:pane_current_path} --word=#{q:mouse_word} --link=#{q:mouse_hyperlink}'
bind -n M-MouseDown1Pane run-shell -b 'vscode-tmux click --session=#{q:session_name} --cwd=#{q:pane_current_path} --word=#{q:mouse_word} --link=#{q:mouse_hyperlink}'

bind -n M-r command-prompt -I '#W' 'rename-window -- "%%"'
bind -n M-w confirm-before -p 'close tab #W? (y/n)' kill-window
