# Ghostty configuration for the VS Code Tmux companion window.
# Loaded on top of your normal Ghostty config via --config-file when the
# companion instance starts (class dev.vscodetmux.Ghostty), normally from the
# systemd user unit app-dev.vscodetmux.Ghostty.service.
#
# The companion is a quake-style dropdown: the process runs in the background
# with no window, and ctrl+` toggles Ghostty's quick terminal. On Wayland that
# is a wlr-layer-shell surface (KWin, Hyprland, sway, niri; not GNOME), and the
# hotkey is a global keybind registered through the XDG GlobalShortcuts portal
# (KDE Plasma 5.27+, GNOME 48+). Needs Ghostty >= 1.3.

title = VS Code Tmux
confirm-close-surface = false
window-show-tab-bar = never
window-inherit-working-directory = false
shell-integration = none

# Run as a background service: no window at startup, and stay alive with no
# windows. The process must keep running or the global shortcut dies with it.
initial-window = false
quit-after-last-window-closed = false

# What a new surface runs. The daemon's `client-attached` tmux hook switches the
# client to the session of the focused VS Code window the moment it attaches, so
# the lobby here is only what you get when the daemon is not running.
command = tmux -L vscode-tmux -f ~/.config/vscode-tmux/tmux.conf new-session -A -s lobby

# The dropdown itself.
keybind = global:ctrl+backquote=toggle_quick_terminal
quick-terminal-position = top
# Pixels, not 100%: Ghostty sizes from the whole monitor with no exclusive zone,
# so a percentage runs under the Plasma panel. F11 in tmux flips this line via
# quick-terminal-height.sh (a reload alone never resizes an existing window).
quick-terminal-size = 1048px
# Stay open when you click back into VS Code (this is a companion terminal, not
# a scratchpad). Set to true for classic quake behaviour.
quick-terminal-autohide = false
gtk-quick-terminal-layer = top
quick-terminal-keyboard-interactivity = on-demand

# tmux owns the tab bar: hand alt+N and tab shortcuts to tmux.
keybind = alt+1=unbind
keybind = alt+2=unbind
keybind = alt+3=unbind
keybind = alt+4=unbind
keybind = alt+5=unbind
keybind = alt+6=unbind
keybind = alt+7=unbind
keybind = alt+8=unbind
keybind = alt+9=unbind
keybind = alt+digit_1=unbind
keybind = alt+digit_2=unbind
keybind = alt+digit_3=unbind
keybind = alt+digit_4=unbind
keybind = alt+digit_5=unbind
keybind = alt+digit_6=unbind
keybind = alt+digit_7=unbind
keybind = alt+digit_8=unbind
keybind = alt+digit_9=unbind
keybind = ctrl+shift+t=unbind
keybind = ctrl+shift+n=unbind
keybind = ctrl+shift+w=unbind
keybind = ctrl+page_up=unbind
keybind = ctrl+page_down=unbind
